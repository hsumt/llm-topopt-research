name: ato
services:
  app:
    platform: linux/amd64
    image: ato:local
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    shm_size: 1gb
    ports:
      - "127.0.0.1:${ATO_PORT:-8501}:8501"
    volumes:
      - ./artifacts:/app/artifacts
      - home:/home/ato
    environment:
      # Runtime only: shell environment takes precedence over the local .env.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FORMULATION_MODEL: ${FORMULATION_MODEL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5

volumes:
  home:
