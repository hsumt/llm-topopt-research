name: ato
services:
  app:
    platform: linux/amd64
    image: ato:local
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    shm_size: 1gb
    ports:
      - "127.0.0.1:${ATO_PORT:-8501}:8501"
    volumes:
      - ./artifacts:/app/artifacts
      - home:/home/ato
      # Host ParaView, used by each run to render its element densities (read-only).
      - ${PARAVIEW_DIR:-/opt/paraview}:/opt/paraview:ro
    environment:
      # Runtime only: shell environment takes precedence over the local .env.
      FORMULATION_PROVIDER: ${FORMULATION_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_REASONING_EFFORT: ${AZURE_OPENAI_REASONING_EFFORT:-}
      # Host path of this repository, so the app can link code citations to VS Code on the host.
      ATO_HOST_REPO: ${ATO_HOST_REPO:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5

volumes:
  home:
